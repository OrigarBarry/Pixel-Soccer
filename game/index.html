  /* ---------- design system: accents per menu family, richer panels, tables and buttons */
  .screen { --accent:#6aa2ff; --accent2:#2a4a8a; }
  .screen:has(> .bar[data-theme="trade"])  { --accent:#3fd0c9; --accent2:#155e5a; }
  .screen:has(> .bar[data-theme="money"])  { --accent:#5ee07a; --accent2:#1f5a2e; }
  .screen:has(> .bar[data-theme="legacy"]) { --accent:#e8b04a; --accent2:#6a4416; }
  .screen:has(> .bar[data-theme="style"])  { --accent:#e05ac8; --accent2:#5a1f55; }
  .screen:has(> .bar[data-theme="draft"])  { --accent:#ff8a4a; --accent2:#6a2c10; }
  .screen:has(> .bar[data-theme="system"]) { --accent:#9aa3c7; --accent2:#2c3463; }
  .bar { padding:8px 10px; background:linear-gradient(90deg, var(--accent2), rgba(20,24,50,.2) 70%); border-left:6px solid var(--accent); box-shadow:0 3px 0 #090b18; }
  .bar .scrtitle { color:#fff; text-shadow:2px 2px 0 #090b18; letter-spacing:1px; }
  .bar .scrtitle::after { content:''; display:block; height:3px; width:48px; margin-top:6px; background:var(--accent); }
  .panel { background:linear-gradient(180deg, #1c2246 0%, var(--panel) 46px); border-color:#2c3463; border-top:3px solid var(--accent2); position:relative; }
  .panel > h3:first-child, .panel > .grouplab:first-child { color:var(--accent); margin-top:0; padding-bottom:6px; border-bottom:2px solid rgba(255,255,255,.06); }
  .panel h3 { color:var(--accent); }
  .screen .grouplab { color:var(--accent); opacity:.85; }
  th { color:var(--accent); border-bottom:2px solid var(--accent2); }
  tbody tr:nth-child(even) td, table > tr:nth-child(even) td { background:rgba(255,255,255,.025); }
  td { font-variant-numeric:tabular-nums; }
  button { transition:transform .06s, box-shadow .06s, background .1s; }
  button:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 4px 0 #090b18; }
  button:active:not(:disabled) { transform:translateY(2px); box-shadow:0 1px 0 #090b18; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:3px solid var(--accent, #6aa2ff); outline-offset:2px; }
  select, input[type=text], input[type=number] { background:#0e1124; color:var(--ink); border:2px solid #3b4583; font-family:inherit; }
